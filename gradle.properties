# Project-wide Gradle settings.
# Optimized for ARM64 AndroidIDE mobile build environment.

# Limit JVM heap to 2GB to prevent Android OS Low Memory Killer (LMK) SIGKILL
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use moderate parallel execution
org.gradle.parallel=true
org.gradle.workers.max=2

# AndroidX configuration
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Kotlin settings
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process

# Build cache enabled, configuration cache disabled for AndroidIDE compatibility
org.gradle.caching=true
org.gradle.configuration-cache=false
